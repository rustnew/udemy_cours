[package]
name = "backend_cour"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
env_logger = "0.11.6"
actix-cors = "0.7"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.3", features = ["postgres", "runtime-async-std"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"          
thiserror = "2.0.11"
actix-files = { version = "0.6", optional = true }
uuid = {version ="1.11.1", features = ["serde", "v4"]}

